<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayeddie Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05060d;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-violet: #8b5cf6;
      --accent-cyan: #22d3ee;
      --text-main: #f5f3ff;
      --text-muted: #9ca3c9;
      --font-head: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-mono);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    /* HEADER / HERO */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .pfp-wrapper {
      width: 110px;
      height: 110px;
      margin: 0 auto 1.2rem;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
    }

    .pfp-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-dark);
      display: block;
    }

    .pfp-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #121526;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    h1 {
      font-family: var(--font-head);
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p.tagline {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 550px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* SOCIAL LINKS HUB */
    .social-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin: 2rem 0;
    }

    .social-card {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1.1rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .social-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-cyan);
      box-shadow: 0 4px 15px rgba(34, 211, 238, 0.15);
    }

    .social-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
    }

    /* SECTION TITLES */
    .section-title {
      font-family: var(--font-head);
      font-size: 1.25rem;
      color: var(--accent-cyan);
      margin: 2.5rem 0 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* HIGHLIGHT RINGS */
    .highlights-scroll {
      display: flex;
      gap: 1.2rem;
      overflow-x: auto;
      padding-bottom: 0.8rem;
      scrollbar-width: thin;
    }

    .highlight-ring {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-width: 80px;
    }

    .ring-outer {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .highlight-ring:hover .ring-outer {
      transform: scale(1.08);
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.55), 0 0 34px rgba(34, 211, 238, 0.35);
    }

    .ring-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      overflow: hidden;
    }

    .ring-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ring-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      text-align: center;
    }

    /* =============================================== */
    /* BUILDS CONVERTED TO SLIDING IMAGE GALLERY       */
    /* =============================================== */
    .gallery-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .gallery-scroll {
      display: flex;
      gap: 1.2rem;
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding: 0.5rem 0.2rem 1.2rem;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-cyan) rgba(255,255,255,0.05);
      width: 100%;
    }

    .gallery-scroll::-webkit-scrollbar { height: 6px; }
    .gallery-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 4px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 4px; }

    .gallery-card {
      min-width: 85%;
      max-width: 85%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      scroll-snap-align: center;
      border: 1px solid var(--border-color);
      background: #0a0b16;
      flex-shrink: 0;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      text-decoration: none;
    }

    .gallery-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .gallery-card-placeholder {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(34, 211, 238, 0.15));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }

    .gallery-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 25px rgba(34, 211, 238, 0.25);
    }

    .gallery-card:hover img {
      transform: scale(1.04);
    }

    .gallery-caption {
      position: relative;
      z-index: 2;
      padding: 2rem 1.2rem 1rem;
      background: linear-gradient(to top, rgba(5, 6, 13, 0.95) 20%, rgba(5, 6, 13, 0.6) 70%, transparent);
    }

    .gallery-title {
      font-family: var(--font-head);
      font-size: 1.15rem;
      color: #fff;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gallery-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .gallery-link-icon {
      font-size: 0.9rem;
      color: var(--accent-cyan);
    }

    .gallery-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      background: rgba(5, 6, 13, 0.8);
      border: 1px solid var(--border-color);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .gallery-nav-btn:hover {
      background: var(--accent-violet);
      border-color: #fff;
      transform: translateY(-50%) scale(1.1);
    }

    .gallery-nav-btn.left { left: -16px; }
    .gallery-nav-btn.right { right: -16px; }

    /* INSTAGRAM-STYLE STORY VIEWER */
    .story-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 13, 0.96);
      backdrop-filter: blur(10px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 1.2rem;
    }

    .story-content {
      width: 100%;
      max-width: 420px;
      height: min(88vh, 780px);
      background: #0a0b16;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }

    .story-progress-row {
      display: flex;
      gap: 4px;
      padding: 10px 12px 0;
      flex-shrink: 0;
    }
    .story-progress-seg {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.25);
      overflow: hidden;
    }
    .story-progress-fill {
      height: 100%;
      width: 0%;
      background: #fff;
    }

    .story-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 10px 12px;
      flex-shrink: 0;
    }
    .story-ring-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }
    .story-header-text { flex: 1; min-width: 0; }
    .story-cat-name {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 0.85rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .story-slide-date {
      font-size: 0.68rem;
      color: var(--text-muted);
    }
    .story-gallery-btn, .story-close-btn {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .story-gallery-btn:hover, .story-close-btn:hover {
      background: rgba(255,255,255,0.18);
      transform: scale(1.08);
    }

    .story-stage {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: pointer;
    }
    .story-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }
    .story-caption-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 1.6rem 1rem 1rem;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      pointer-events: none;
    }
    .story-caption-title {
      font-family: var(--font-head);
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 0.2rem;
    }
    .story-caption-text {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* STORY MODAL GALLERY MODE */
    .modal-gallery-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.5rem 0.3rem;
      overflow: hidden;
    }
    .modal-gallery-scroll {
      flex: 1;
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding: 0.8rem 0.6rem;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-cyan) rgba(255,255,255,0.05);
      height: 100%;
      align-items: center;
    }
    .modal-gallery-nav {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }
    .modal-gallery-nav:hover { background: rgba(255,255,255,0.2); }

    .modal-gallery-photo {
      position: relative;
      min-width: 78%;
      max-width: 78%;
      height: 92%;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
      scroll-snap-align: center;
      background: #000;
    }
    .modal-gallery-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .modal-gallery-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0.6rem 0.7rem;
      font-size: 0.72rem;
      color: #fff;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
    }

    @media (max-width: 480px) {
      .gallery-card { min-width: 90%; max-width: 90%; }
      .gallery-nav-btn { display: none; }
      .story-content { height: 92vh; border-radius: 14px; }
      .modal-gallery-photo { min-width: 88%; max-width: 88%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="pfp-wrapper">
        <img id="pfp-img" class="pfp-img" src="" alt="Profile Picture" style="display:none;">
        <div id="pfp-fallback" class="pfp-fallback">⚡</div>
      </div>
      <h1 id="hero-title">aayeddie</h1>
      <p id="hero-tagline" class="tagline">Builder of small worlds — apps, games, and things that glow.</p>

      <div id="socials-grid" class="social-grid"></div>
    </header>

    <section id="highlights-section" style="display:none;">
      <h2 class="section-title">✨ Highlights</h2>
      <div id="highlights-scroll" class="highlights-scroll"></div>
    </section>

    <section id="gallery-section" style="display:none;">
      <h2 class="section-title">🖼️ Gallery Showcase</h2>
      <div class="gallery-wrapper">
        <button class="gallery-nav-btn left" onclick="slideMainGallery(-1)">‹</button>
        <div id="main-gallery-scroll" class="gallery-scroll"></div>
        <button class="gallery-nav-btn right" onclick="slideMainGallery(1)">›</button>
      </div>
    </section>

    <footer>
      <p>© <span id="year"></span> @aayeddie. All rights reserved.</p>
    </footer>
  </div>

  <div id="modal" class="story-modal">
    <div class="story-content" onclick="event.stopPropagation()">

      <div class="story-progress-row" id="story-progress-row"></div>

      <div class="story-header">
        <div class="story-ring-avatar" id="story-avatar"></div>
        <div class="story-header-text">
          <div class="story-cat-name" id="story-cat-name"></div>
          <div class="story-slide-date" id="story-slide-date"></div>
        </div>
        <button class="story-gallery-btn" id="story-gallery-toggle" onclick="toggleGalleryMode()" title="View as scrollable gallery">▦</button>
        <button class="story-close-btn" onclick="closeModal()" title="Close">&times;</button>
      </div>

      <div class="story-stage" id="story-stage">
        <img id="story-img" class="story-img" src="" alt="Highlight slide">
        <div class="story-caption-wrap">
          <div class="story-caption-title" id="story-caption-title"></div>
          <div class="story-caption-text" id="story-caption-text"></div>
        </div>
      </div>

      <div class="modal-gallery-wrap" id="modal-gallery-wrap" style="display:none;">
        <button class="modal-gallery-nav" onclick="scrollHighlightGallery(-1)">‹</button>
        <div class="modal-gallery-scroll" id="modal-gallery-scroll"></div>
        <button class="modal-gallery-nav" onclick="scrollHighlightGallery(1)">›</button>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    async function loadSiteData() {
      let data = {};
      try {
        const res = await fetch('data.json');
        const contentType = res.headers.get('content-type') || '';
        if (res.ok && contentType.includes('json')) {
          data = await res.json();
        }
      } catch (e) {}

      // Check localStorage for overrides
      const pfp = localStorage.getItem('aayeddie_pfp') || data.pfp;
      const title = localStorage.getItem('aayeddie_hero_title') || (data.hero && data.hero.title) || 'aayeddie';
      const tagline = localStorage.getItem('aayeddie_hero_tagline') || (data.hero && data.hero.tagline) || '';

      // Set PFP
      if (pfp) {
        const img = document.getElementById('pfp-img');
        img.src = pfp;
        img.style.display = 'block';
        document.getElementById('pfp-fallback').style.display = 'none';
      }

      // Set Hero Text
      document.getElementById('hero-title').textContent = title;
      document.getElementById('hero-tagline').textContent = tagline;

      // Set Socials
      const socialsData = localStorage.getItem('aayeddie_custom_socials');
      const socials = socialsData ? JSON.parse(socialsData) : (data.socials || []);
      const socialsGrid = document.getElementById('socials-grid');

      socialsGrid.innerHTML = socials.map(s => `
        <a class="social-card" href="${s.url}" target="_blank" rel="noopener">
          <div class="social-badge" style="background:${s.color || 'var(--accent-violet)'}">${s.init || s.name[0]}</div>
          <div>
            <div style="font-weight:600;">${s.name}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">${s.handle}</div>
          </div>
        </a>
      `).join('');

      // Set Highlights
      const highlightsData = localStorage.getItem('aayeddie_custom_highlights');
      const highlights = highlightsData ? JSON.parse(highlightsData) : (data.highlights || []);
      if (highlights.length > 0) {
        document.getElementById('highlights-section').style.display = 'block';
        const hScroll = document.getElementById('highlights-scroll');
        hScroll.innerHTML = highlights.map((h, index) => `
          <div class="highlight-ring" onclick="openHighlight(${index})">
            <div class="ring-outer" style="background: linear-gradient(135deg, ${h.c1 || '#8b5cf6'}, ${h.c2 || '#22d3ee'});">
              <div class="ring-inner">
                ${h.coverImage ? `<img src="${h.coverImage}" alt="${h.cat}">` : `<span>${h.icon || '⭐'}</span>`}
              </div>
            </div>
            <span class="ring-label">${h.cat}</span>
          </div>
        `).join('');
        window.siteHighlights = highlights;
      }

      // RENDER BUILDS / GALLERY ITEMS
      const buildsData = localStorage.getItem('aayeddie_custom_builds');
      const builds = buildsData ? JSON.parse(buildsData) : (data.builds || []);
      
      const galleryData = localStorage.getItem('aayeddie_custom_gallery');
      const gallery = galleryData ? JSON.parse(galleryData) : (data.gallery || []);

      const items = builds.length > 0 ? builds : gallery;

      if (items.length > 0) {
        document.getElementById('gallery-section').style.display = 'block';
        const gScroll = document.getElementById('main-gallery-scroll');

        gScroll.innerHTML = items.map(b => {
          const hasUrl = b.url && b.url !== '#';
          const tag = hasUrl ? 'a' : 'div';
          const hrefAttr = hasUrl ? `href="${b.url}" target="_blank" rel="noopener"` : '';

          // Look for image across all potential key names
          const imageSrc = b.image || b.img || b.cover || b.imageUrl || b.thumbnail || b.url_image || '';

          return `
            <${tag} class="gallery-card" ${hrefAttr}>
              ${imageSrc 
                ? `<img src="${imageSrc}" alt="${b.title || 'Image'}" loading="lazy" onerror="this.onerror=null; this.parentElement.querySelector('.gallery-card-placeholder').style.display='flex'; this.remove();">
                   <div class="gallery-card-placeholder" style="display:none;">🖼️</div>` 
                : `<div class="gallery-card-placeholder">🚀</div>`}
              <div class="gallery-caption">
                <div class="gallery-title">
                  <span>${b.title || ''}</span>
                  ${hasUrl ? `<span class="gallery-link-icon">→</span>` : ''}
                </div>
                <div class="gallery-desc">${b.desc || b.caption || ''}</div>
              </div>
            </${tag}>
          `;
        }).join('');
      }
    }

    /* Main Gallery Slide Navigation */
    function slideMainGallery(direction) {
      const el = document.getElementById('main-gallery-scroll');
      if (el) {
        const slideAmount = el.clientWidth * 0.85;
        el.scrollBy({ left: direction * slideAmount, behavior: 'smooth' });
      }
    }

    /* =====================================================
       INSTAGRAM-STYLE STORY VIEWER ENGINE
       ===================================================== */
    const STORY_DURATION = 4500;

    let storySlides = [];
    let storyIndex = 0;
    let storyTimer = null;
    let galleryModeOn = false;
    let pointerDownAt = 0;

    function openHighlight(index) {
      const h = window.siteHighlights[index];
      if (!h || !h.slides || h.slides.length === 0) return;

      storySlides = h.slides;
      storyIndex = 0;
      galleryModeOn = false;

      const avatar = document.getElementById('story-avatar');
      avatar.style.background = h.coverImage
        ? `url('${h.coverImage}') center/cover`
        : `linear-gradient(135deg, ${h.c1 || '#8b5cf6'}, ${h.c2 || '#22d3ee'})`;
      document.getElementById('story-cat-name').textContent = h.cat || '';

      buildProgressBars();
      setGalleryMode(false);

      document.getElementById('modal').style.display = 'flex';
      document.addEventListener('keydown', handleStoryKeydown);

      showStorySlide(0);
    }

    function buildProgressBars() {
      const row = document.getElementById('story-progress-row');
      row.innerHTML = storySlides.map((_, i) => `
        <div class="story-progress-seg"><div class="story-progress-fill" id="story-fill-${i}"></div></div>
      `).join('');
    }

    function showStorySlide(i) {
      clearTimeout(storyTimer);

      if (i < 0 || i >= storySlides.length) { closeModal(); return; }

      storyIndex = i;
      const slide = storySlides[i];

      document.getElementById('story-img').src = slide.image || '';
      document.getElementById('story-caption-title').textContent = slide.title || '';
      document.getElementById('story-caption-text').textContent = slide.caption || '';
      document.getElementById('story-slide-date').textContent = slide.date ? `Date: ${slide.date}` : '';

      storySlides.forEach((_, idx) => {
        const fill = document.getElementById('story-fill-' + idx);
        if (!fill) return;
        fill.style.transition = 'none';
        fill.style.width = idx < i ? '100%' : '0%';
      });

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const fill = document.getElementById('story-fill-' + i);
          if (fill) {
            fill.style.transition = `width ${STORY_DURATION}ms linear`;
            fill.style.width = '100%';
          }
        });
      });

      if (!galleryModeOn) {
        storyTimer = setTimeout(() => storyNext(), STORY_DURATION);
      }
    }

    function storyNext() { showStorySlide(storyIndex + 1); }
    function storyPrev() { showStorySlide(storyIndex - 1); }

    function pauseStory() {
      clearTimeout(storyTimer);
      const fill = document.getElementById('story-fill-' + storyIndex);
      if (fill) {
        const computed = getComputedStyle(fill).width;
        fill.style.transition = 'none';
        fill.style.width = computed;
      }
    }

    function resumeStory() {
      if (galleryModeOn) return;
      const fill = document.getElementById('story-fill-' + storyIndex);
      if (!fill) return;
      const seg = fill.parentElement;
      const ratioDone = seg.offsetWidth > 0 ? (fill.getBoundingClientRect().width / seg.getBoundingClientRect().width) : 0;
      const remaining = Math.max(STORY_DURATION * (1 - ratioDone), 150);

      requestAnimationFrame(() => {
        fill.style.transition = `width ${remaining}ms linear`;
        fill.style.width = '100%';
      });
      storyTimer = setTimeout(() => storyNext(), remaining);
    }

    function handleStoryKeydown(e) {
      if (document.getElementById('modal').style.display !== 'flex') return;
      if (e.key === 'ArrowRight') storyNext();
      else if (e.key === 'ArrowLeft') storyPrev();
      else if (e.key === 'Escape') closeModal();
    }

    (function setupStoryStage() {
      const stage = document.getElementById('story-stage');
      stage.addEventListener('pointerdown', () => {
        pointerDownAt = Date.now();
        pauseStory();
      });
      stage.addEventListener('pointerup', (e) => {
        const heldFor = Date.now() - pointerDownAt;
        resumeStory();
        if (heldFor < 250) {
          const rect = stage.getBoundingClientRect();
          const x = e.clientX - rect.left;
          if (x < rect.width / 2) storyPrev();
          else storyNext();
        }
      });
      stage.addEventListener('pointerleave', () => resumeStory());
    })();

    function closeModal(e) {
      if (e) e.stopPropagation();
      document.getElementById('modal').style.display = 'none';
      clearTimeout(storyTimer);
      document.removeEventListener('keydown', handleStoryKeydown);
    }

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    function toggleGalleryMode() {
      galleryModeOn = !galleryModeOn;
      setGalleryMode(galleryModeOn);
    }

    function setGalleryMode(on) {
      document.getElementById('story-stage').style.display = on ? 'none' : 'flex';
      document.getElementById('story-progress-row').style.display = on ? 'none' : 'flex';
      document.getElementById('modal-gallery-wrap').style.display = on ? 'flex' : 'none';
      const btn = document.getElementById('story-gallery-toggle');
      btn.textContent = on ? '▶' : '▦';
      btn.title = on ? 'Back to Story View' : 'View as scrollable gallery';

      if (on) {
        clearTimeout(storyTimer);
        renderHighlightGallery();
      } else {
        showStorySlide(storyIndex);
      }
    }

    function renderHighlightGallery() {
      const wrap = document.getElementById('modal-gallery-scroll');
      wrap.innerHTML = storySlides.map((s, idx) => `
        <div class="modal-gallery-photo" onclick="jumpToStorySlide(${idx})">
          <img src="${s.image || ''}" alt="${s.title || ''}">
          <div class="modal-gallery-caption">${s.title || ''}</div>
        </div>
      `).join('');
    }

    function jumpToStorySlide(idx) {
      galleryModeOn = false;
      setGalleryMode(false);
      showStorySlide(idx);
    }

    function scrollHighlightGallery(dir) {
      const el = document.getElementById('modal-gallery-scroll');
      if (el) el.scrollBy({ left: dir * 300, behavior: 'smooth' });
    }

    loadSiteData();
  </script>
</body>
</html>

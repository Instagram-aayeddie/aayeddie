<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayeddie Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05060d;
      --card-bg: rgba(18, 21, 38, 0.45);
      --border-color: rgba(255, 255, 255, 0.15);
      --accent-violet: #8b5cf6;
      --accent-cyan: #22d3ee;
      --text-main: #f5f3ff;
      --text-muted: #9ca3c9;
      --font-head: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(135deg, rgba(5, 6, 13, 0.92), rgba(8, 10, 22, 0.85)),
        url('https://scontent-hou1-1.cdninstagram.com/v/t51.82787-15/522608365_17957052389967403_6724229147812826609_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=106&ig_cache_key=MzY4NDU0NjA4NDgxNzg5NDgxNw%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuNzE5LnNkci5yZWd1bGFyX3Bob3RvLkMzIn0%3D&_nc_ohc=mR9xJIl3wPwQ7kNvwFSMPob&_nc_oc=AdqTkJwXS-jiKzWaxDGOqqGrmIteJVi0T_xaSG1NuV-dFmjiYqjuEpZPAeEVQ8FkF1E&_nc_zt=23&_nc_ht=scontent-hou1-1.cdninstagram.com&_nc_gid=yKMir1IB-19vaWsaVUzY3A&_nc_ss=7b289&oh=00_AQG4ipO_kd_ZwVaHn2IZKn7C1GcLweNF6wcQ1aTlnGjeXQ&oe=6A772CB4');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-mono);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* BUBBLE CANVAS BACKGROUND */
    #bubble-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: auto;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 850px;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    .container * {
      pointer-events: auto;
    }

    /* HEADER / HERO */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .pfp-wrapper {
      width: 110px;
      height: 110px;
      margin: 0 auto 1.2rem;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
    }

    .pfp-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-dark);
      display: block;
    }

    .pfp-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #121526;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    h1 {
      font-family: var(--font-head);
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p.tagline {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 550px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* SOCIAL LINKS HUB */
    .social-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin: 2rem 0;
    }

    .social-card {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1.1rem;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .social-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-cyan);
      box-shadow: 0 4px 15px rgba(34, 211, 238, 0.2);
    }

    .social-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
    }

    /* SECTION TITLES */
    .section-title {
      font-family: var(--font-head);
      font-size: 1.25rem;
      color: var(--accent-cyan);
      margin: 2.5rem 0 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-shadow: 0 0 12px rgba(34, 211, 238, 0.4);
    }

    /* HIGHLIGHT RINGS */
    .highlights-scroll {
      display: flex;
      gap: 1.2rem;
      overflow-x: auto;
      padding-bottom: 0.8rem;
      scrollbar-width: thin;
    }

    .highlight-ring {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-width: 80px;
    }

    .ring-outer {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .highlight-ring:hover .ring-outer {
      transform: scale(1.08);
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.55), 0 0 34px rgba(34, 211, 238, 0.35);
    }

    .ring-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      overflow: hidden;
    }

    .ring-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ring-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      text-align: center;
    }

    /* =============================================== */
    /* SLIDING GALLERY (DYNAMIC ASPECT RATIO)         */
    /* =============================================== */
    .gallery-wrapper {
      position: relative;
      width: 100%;
    }

    .gallery-scroll {
      display: flex;
      align-items: flex-start;
      gap: 1.2rem;
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding: 0.5rem 0.2rem 1.2rem;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-cyan) rgba(255,255,255,0.05);
      width: 100%;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }

    .gallery-scroll.active {
      cursor: grabbing;
      scroll-behavior: auto;
      scroll-snap-type: none;
    }

    .gallery-scroll::-webkit-scrollbar { height: 6px; }
    .gallery-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 4px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 4px; }

    .gallery-card {
      min-width: 85%;
      max-width: 85%;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      scroll-snap-align: center;
      border: 1px solid var(--border-color);
      background: rgba(10, 11, 22, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      flex-shrink: 0;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      text-decoration: none;
      cursor: pointer;
      align-self: flex-start;
    }

    .gallery-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
      pointer-events: none;
    }

    .gallery-card-placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(34, 211, 238, 0.15));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      pointer-events: none;
    }

    .gallery-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 25px rgba(34, 211, 238, 0.25);
    }

    .gallery-card:hover img {
      transform: scale(1.04);
    }

    .gallery-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      padding: 2rem 1.2rem 1rem;
      background: linear-gradient(to top, rgba(5, 6, 13, 0.95) 20%, rgba(5, 6, 13, 0.6) 70%, transparent);
      pointer-events: none;
    }

    .gallery-title {
      font-family: var(--font-head);
      font-size: 1.15rem;
      color: #fff;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gallery-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* FULLSCREEN IMAGE LIGHTBOX MODAL */
    .fullscreen-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 4, 9, 0.95);
      backdrop-filter: blur(12px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      cursor: zoom-out;
    }

    .fullscreen-content {
      max-width: 95vw;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .fullscreen-img {
      max-width: 100%;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 40px rgba(34, 211, 238, 0.2);
    }

    .fullscreen-caption {
      margin-top: 1rem;
      text-align: center;
    }

    .fullscreen-title {
      font-family: var(--font-head);
      font-size: 1.3rem;
      color: #fff;
      margin-bottom: 0.2rem;
    }

    .fullscreen-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .fullscreen-close {
      position: absolute;
      top: -45px;
      right: 0;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      background: none;
      border: none;
      opacity: 0.8;
      transition: opacity 0.2s ease;
    }

    .fullscreen-close:hover { opacity: 1; }

    /* INSTAGRAM-STYLE STORY VIEWER */
    .story-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 13, 0.96);
      backdrop-filter: blur(10px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 1.2rem;
    }

    .story-content {
      width: 100%;
      max-width: 420px;
      height: min(88vh, 780px);
      background: #0a0b16;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }

    .story-progress-row {
      display: flex;
      gap: 4px;
      padding: 10px 12px 0;
      flex-shrink: 0;
    }
    .story-progress-seg {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.25);
      overflow: hidden;
    }
    .story-progress-fill {
      height: 100%;
      width: 0%;
      background: #fff;
    }

    .story-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 10px 12px;
      flex-shrink: 0;
    }
    .story-ring-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }
    .story-header-text { flex: 1; min-width: 0; }
    .story-cat-name {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 0.85rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .story-slide-date {
      font-size: 0.68rem;
      color: var(--text-muted);
    }
    .story-gallery-btn, .story-close-btn {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .story-gallery-btn:hover, .story-close-btn:hover {
      background: rgba(255,255,255,0.18);
      transform: scale(1.08);
    }

    .story-stage {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: pointer;
    }
    .story-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }
    .story-caption-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 1.6rem 1rem 1rem;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      pointer-events: none;
    }
    .story-caption-title {
      font-family: var(--font-head);
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 0.2rem;
    }
    .story-caption-text {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .modal-gallery-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.5rem 0.3rem;
      overflow: hidden;
    }
    .modal-gallery-scroll {
      flex: 1;
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding: 0.8rem 0.6rem;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-cyan) rgba(255,255,255,0.05);
      height: 100%;
      align-items: center;
    }
    .modal-gallery-nav {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }
    .modal-gallery-nav:hover { background: rgba(255,255,255,0.2); }

    .modal-gallery-photo {
      position: relative;
      min-width: 78%;
      max-width: 78%;
      height: 92%;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
      scroll-snap-align: center;
      background: #000;
    }
    .modal-gallery-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .modal-gallery-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0.6rem 0.7rem;
      font-size: 0.72rem;
      color: #fff;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
    }

    @media (max-width: 480px) {
      .gallery-card { min-width: 90%; max-width: 90%; }
      .story-content { height: 92vh; border-radius: 14px; }
      .modal-gallery-photo { min-width: 88%; max-width: 88%; }
    }
  </style>

  <script>
    /* Image Error Handlers defined in HEAD to guarantee scope during HTML parsing */
    function handleImgError(imgElement) {
      if (!imgElement) return;

      if (!imgElement.dataset.retried) {
        imgElement.dataset.retried = 'true';
        const originalSrc = imgElement.src;
        setTimeout(() => {
          const separator = originalSrc.includes('?') ? '&' : '?';
          imgElement.src = originalSrc + separator + '_retry=' + Date.now();
        }, 500);
        return;
      }

      imgElement.style.display = 'none';
      const parentCard = imgElement.closest('.gallery-card');
      if (parentCard) {
        const placeholder = parentCard.querySelector('.gallery-card-placeholder');
        if (placeholder) placeholder.style.display = 'flex';
      }
    }

    function handlePfpError(img) {
      if (!img) return;
      img.style.display = 'none';
      const fallback = document.getElementById('pfp-fallback');
      if (fallback) fallback.style.display = 'flex';
    }

    function handleFullscreenImgError(img) {
      if (img) img.style.display = 'none';
    }

    function handleStoryImgError(img) {
      if (img) img.style.display = 'none';
    }
  </script>
</head>
<body>

  <!-- INTERACTIVE BUBBLE CANVAS BACKGROUND -->
  <canvas id="bubble-canvas"></canvas>

  <div class="container">
    <header>
      <div class="pfp-wrapper">
        <img id="pfp-img" class="pfp-img" src="" alt="Profile Picture" style="display:none;" onerror="handlePfpError(this)">
        <div id="pfp-fallback" class="pfp-fallback">⚡</div>
      </div>
      <h1 id="hero-title">aayeddie</h1>
      <p id="hero-tagline" class="tagline">Builder of small worlds — apps, games, and things that glow.</p>

      <div id="socials-grid" class="social-grid"></div>
    </header>

    <section id="highlights-section" style="display:none;">
      <h2 class="section-title">✨ Highlights</h2>
      <div id="highlights-scroll" class="highlights-scroll"></div>
    </section>

    <section id="gallery-section" style="display:none;">
      <h2 class="section-title">🖼️ Gallery Showcase</h2>
      <div class="gallery-wrapper">
        <div id="main-gallery-scroll" class="gallery-scroll"></div>
      </div>
    </section>

    <footer>
      <p>© <span id="year"></span> @aayeddie. All rights reserved.</p>
    </footer>
  </div>

  <div id="fullscreen-modal" class="fullscreen-modal" onclick="closeFullscreen()">
    <div class="fullscreen-content" onclick="event.stopPropagation()">
      <button class="fullscreen-close" onclick="closeFullscreen()">&times;</button>
      <img id="fullscreen-img" class="fullscreen-img" src="" alt="Full resolution view" onerror="handleFullscreenImgError(this)">
      <div class="fullscreen-caption">
        <div id="fullscreen-title" class="fullscreen-title"></div>
        <div id="fullscreen-desc" class="fullscreen-desc"></div>
      </div>
    </div>
  </div>

  <div id="modal" class="story-modal">
    <div class="story-content" onclick="event.stopPropagation()">

      <div class="story-progress-row" id="story-progress-row"></div>

      <div class="story-header">
        <div class="story-ring-avatar" id="story-avatar"></div>
        <div class="story-header-text">
          <div class="story-cat-name" id="story-cat-name"></div>
          <div class="story-slide-date" id="story-slide-date"></div>
        </div>
        <button class="story-gallery-btn" id="story-gallery-toggle" onclick="toggleGalleryMode()" title="View as scrollable gallery">▦</button>
        <button class="story-close-btn" onclick="closeModal()" title="Close">&times;</button>
      </div>

      <div class="story-stage" id="story-stage">
        <img id="story-img" class="story-img" src="" alt="Highlight slide" onerror="handleStoryImgError(this)">
        <div class="story-caption-wrap">
          <div class="story-caption-title" id="story-caption-title"></div>
          <div class="story-caption-text" id="story-caption-text"></div>
        </div>
      </div>

      <div class="modal-gallery-wrap" id="modal-gallery-wrap" style="display:none;">
        <button class="modal-gallery-nav" onclick="scrollHighlightGallery(-1)">‹</button>
        <div class="modal-gallery-scroll" id="modal-gallery-scroll"></div>
        <button class="modal-gallery-nav" onclick="scrollHighlightGallery(1)">›</button>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    /* =====================================================
       ZERO-LATENCY WEB AUDIO SYNTHESIZER ENGINE
       ===================================================== */
    let audioCtx = null;
    let lastPopSoundTime = 0;
    let lastWhooshSoundTime = 0;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    // Direct User Interaction Unlock
    window.addEventListener('pointerdown', getAudioContext, { once: true });
    window.addEventListener('keydown', getAudioContext, { once: true });

    /* Instant Provocative Pop Sound (Web Audio Synthesizer) */
    function triggerPopSound() {
      const now = Date.now();
      if (now - lastPopSoundTime < 30) return;
      lastPopSoundTime = now;

      const ctx = getAudioContext();
      if (!ctx) return;

      const currentTime = ctx.currentTime;

      // Primary Pitch-Dropped Sine Oscillator
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      const baseFreq = 420 + Math.random() * 260; // Vibrant randomized frequency range
      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq, currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, currentTime + 0.08);

      gain.gain.setValueAtTime(0.7, currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, currentTime + 0.08);

      osc.connect(gain);

      // Metallic High Transient Noise Snap
      const bufferSize = ctx.sampleRate * 0.02; // 20ms burst
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;

      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'highpass';
      noiseFilter.frequency.value = 1800;

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.4, currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, currentTime + 0.02);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);

      gain.connect(ctx.destination);
      noiseGain.connect(ctx.destination);

      osc.start(currentTime);
      noise.start(currentTime);
      osc.stop(currentTime + 0.09);
      noise.stop(currentTime + 0.03);
    }

    /* Cinematic Deep Sub Whoosh (Web Audio Synthesizer) */
    function triggerWhooshSound() {
      const now = Date.now();
      if (now - lastWhooshSoundTime < 180) return;
      lastWhooshSoundTime = now;

      const ctx = getAudioContext();
      if (!ctx) return;

      const currentTime = ctx.currentTime;
      const duration = 0.22;

      // Filtered Pink Noise Burst
      const bufferSize = ctx.sampleRate * duration;
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        output[i] *= 0.11;
        b6 = white * 0.115926;
      }

      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;

      // Dynamic Lowpass Sweeping Filter
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.Q.value = 4.0; // Resonant sweep boost
      filter.frequency.setValueAtTime(120, currentTime);
      filter.frequency.exponentialRampToValueAtTime(1400, currentTime + duration * 0.5);
      filter.frequency.exponentialRampToValueAtTime(80, currentTime + duration);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.01, currentTime);
      gain.gain.linearRampToValueAtTime(0.5, currentTime + duration * 0.4);
      gain.gain.exponentialRampToValueAtTime(0.001, currentTime + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      noise.start(currentTime);
      noise.stop(currentTime + duration);
    }

    /* =====================================================
       PHYSICS BUBBLE ENGINE WITH POPPING PARTICLES & SOUND
       ===================================================== */
    (function initInteractiveBubbles() {
      const canvas = document.getElementById('bubble-canvas');
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      const mouse = {
        x: -1000,
        y: -1000,
        radius: 180,
        isActive: false
      };

      const popRings = [];
      const popParticles = [];

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const trackPointer = (x, y) => {
        mouse.x = x;
        mouse.y = y;
        mouse.isActive = true;
      };

      window.addEventListener('mousemove', (e) => trackPointer(e.clientX, e.clientY));
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          trackPointer(e.touches[0].clientX, e.touches[0].clientY);
        }
      });

      window.addEventListener('mouseleave', () => { mouse.isActive = false; });
      window.addEventListener('touchend', () => { mouse.isActive = false; });

      class PopParticle {
        constructor(x, y, hue) {
          this.x = x;
          this.y = y;
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 4 + 1.5;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = Math.random() * 3 + 2;
          this.hue = hue;
          this.alpha = 1.0;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.alpha -= 0.04;
        }

        draw() {
          if (this.alpha <= 0) return;
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, ${this.alpha})`;
          ctx.fill();
          ctx.restore();
        }
      }

      class PopRing {
        constructor(x, y, radius, hue) {
          this.x = x;
          this.y = y;
          this.radius = radius;
          this.currentRadius = radius * 0.4;
          this.maxRadius = radius * 2.2;
          this.hue = hue;
          this.alpha = 0.9;
        }

        update() {
          this.currentRadius += (this.maxRadius - this.currentRadius) * 0.3;
          this.alpha -= 0.06;
        }

        draw() {
          if (this.alpha <= 0) return;
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${this.hue}, 100%, 75%, ${this.alpha})`;
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.restore();
        }
      }

      class Bubble {
        constructor() {
          this.reset(true);
        }

        reset(initial = false) {
          this.radius = Math.random() * 26 + 10;
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : height + this.radius + Math.random() * 50;
          
          this.vx = (Math.random() - 0.5) * 0.8;
          this.vy = -Math.random() * 0.9 - 0.3;
          
          this.baseVx = this.vx;
          this.baseVy = this.vy;
          
          this.alpha = Math.random() * 0.45 + 0.25;
          this.hue = Math.random() > 0.5 ? 260 : 190;
          this.cooldown = 0;
        }

        pop() {
          triggerPopSound();
          popRings.push(new PopRing(this.x, this.y, this.radius, this.hue));
          
          // Spawn vibrant explosion particles
          for (let i = 0; i < 6; i++) {
            popParticles.push(new PopParticle(this.x, this.y, this.hue));
          }

          this.reset(false);
        }

        update() {
          if (this.cooldown > 0) this.cooldown--;

          this.x += this.vx;
          this.y += this.vy;

          this.vx += (this.baseVx - this.vx) * 0.03;
          this.vy += (this.baseVy - this.vy) * 0.03;

          // Interactive Repulsion Physics & Instant Pop Triggering
          if (mouse.isActive) {
            const dx = this.x - mouse.x;
            const dy = this.y - mouse.y;
            const dist = Math.hypot(dx, dy);

            if (dist < mouse.radius) {
              const force = (mouse.radius - dist) / mouse.radius;
              const angle = Math.atan2(dy, dx);
              const push = force * 6.5;

              this.vx += Math.cos(angle) * push * 0.3;
              this.vy += Math.sin(angle) * push * 0.3;

              // Pop if pointer touches center of bubble
              if (dist < this.radius + 18 && this.cooldown === 0) {
                this.pop();
                return;
              }
            }
          }

          if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -0.8; }
          if (this.x + this.radius > width) { this.x = width - this.radius; this.vx *= -0.8; }

          if (this.y + this.radius < -20) {
            this.reset(false);
          }
        }

        draw() {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

          const grad = ctx.createRadialGradient(
            this.x - this.radius * 0.3,
            this.y - this.radius * 0.3,
            this.radius * 0.1,
            this.x,
            this.y,
            this.radius
          );

          grad.addColorStop(0, `hsla(${this.hue}, 90%, 80%, ${this.alpha * 0.7})`);
          grad.addColorStop(0.6, `hsla(${this.hue}, 80%, 55%, ${this.alpha * 0.3})`);
          grad.addColorStop(1, `hsla(${this.hue}, 80%, 40%, 0.05)`);

          ctx.fillStyle = grad;
          ctx.fill();

          ctx.strokeStyle = `hsla(${this.hue}, 100%, 75%, ${this.alpha * 0.6})`;
          ctx.lineWidth = 1.2;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(this.x - this.radius * 0.35, this.y - this.radius * 0.35, this.radius * 0.22, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.7})`;
          ctx.fill();

          ctx.restore();
        }
      }

      const bubbleCount = Math.floor(Math.min(window.innerWidth / 16, 55));
      const bubbles = Array.from({ length: bubbleCount }, () => new Bubble());

      // Direct Click/Tap on Canvas to Pop Nearest Bubble
      canvas.addEventListener('pointerdown', (e) => {
        getAudioContext();
        const clickX = e.clientX;
        const clickY = e.clientY;

        for (let b of bubbles) {
          const dist = Math.hypot(b.x - clickX, b.y - clickY);
          if (dist < b.radius + 14) {
            b.pop();
            break;
          }
        }
      });

      function animate() {
        ctx.clearRect(0, 0, width, height);

        // Update and draw pop particle effects
        for (let i = popRings.length - 1; i >= 0; i--) {
          popRings[i].update();
          popRings[i].draw();
          if (popRings[i].alpha <= 0) {
            popRings.splice(i, 1);
          }
        }

        for (let i = popParticles.length - 1; i >= 0; i--) {
          popParticles[i].update();
          popParticles[i].draw();
          if (popParticles[i].alpha <= 0) {
            popParticles.splice(i, 1);
          }
        }

        // Update and draw floating bubbles
        bubbles.forEach(b => {
          b.update();
          b.draw();
        });
        requestAnimationFrame(animate);
      }

      animate();
    })();

    let isDragging = false;
    let startX, scrollLeft;
    let hasDraggedDistance = false;
    let lastScrollPos = 0;

    async function loadSiteData() {
      let data = {};
      try {
        const res = await fetch('data.json');
        const contentType = res.headers.get('content-type') || '';
        if (res.ok && contentType.includes('json')) {
          data = await res.json();
        }
      } catch (e) {}

      // Check localStorage for overrides
      const pfp = localStorage.getItem('aayeddie_pfp') || data.pfp;
      const title = localStorage.getItem('aayeddie_hero_title') || (data.hero && data.hero.title) || 'aayeddie';
      const tagline = localStorage.getItem('aayeddie_hero_tagline') || (data.hero && data.hero.tagline) || '';

      if (pfp) {
        const img = document.getElementById('pfp-img');
        img.src = pfp;
        img.style.display = 'block';
        document.getElementById('pfp-fallback').style.display = 'none';
      }

      document.getElementById('hero-title').textContent = title;
      document.getElementById('hero-tagline').textContent = tagline;

      // Socials
      const socialsData = localStorage.getItem('aayeddie_custom_socials');
      const socials = socialsData ? JSON.parse(socialsData) : (data.socials || []);
      document.getElementById('socials-grid').innerHTML = socials.map(s => `
        <a class="social-card" href="${s.url}" target="_blank" rel="noopener">
          <div class="social-badge" style="background:${s.color || 'var(--accent-violet)'}">${s.init || s.name[0]}</div>
          <div>
            <div style="font-weight:600;">${s.name}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">${s.handle}</div>
          </div>
        </a>
      `).join('');

      // Highlights
      const highlightsData = localStorage.getItem('aayeddie_custom_highlights');
      const highlights = highlightsData ? JSON.parse(highlightsData) : (data.highlights || []);
      if (highlights.length > 0) {
        document.getElementById('highlights-section').style.display = 'block';
        document.getElementById('highlights-scroll').innerHTML = highlights.map((h, index) => `
          <div class="highlight-ring" onclick="openHighlight(${index})">
            <div class="ring-outer" style="background: linear-gradient(135deg, ${h.c1 || '#8b5cf6'}, ${h.c2 || '#22d3ee'});">
              <div class="ring-inner">
                ${h.coverImage ? `<img src="${h.coverImage}" alt="${h.cat}" onerror="this.onerror=null; this.parentElement.innerHTML='<span>${h.icon || '⭐'}</span>';">` : `<span>${h.icon || '⭐'}</span>`}
              </div>
            </div>
            <span class="ring-label">${h.cat}</span>
          </div>
        `).join('');
        window.siteHighlights = highlights;
      }

      // RENDER BUILDS / GALLERY
      const buildsData = localStorage.getItem('aayeddie_custom_builds');
      const builds = buildsData ? JSON.parse(buildsData) : (data.builds || []);
      const galleryData = localStorage.getItem('aayeddie_custom_gallery');
      const gallery = galleryData ? JSON.parse(galleryData) : (data.gallery || []);

      const items = builds.length > 0 ? builds : gallery;

      if (items.length > 0) {
        document.getElementById('gallery-section').style.display = 'block';
        const gScroll = document.getElementById('main-gallery-scroll');

        gScroll.innerHTML = items.map((b, idx) => {
          const imageSrc = b.image || b.img || b.cover || b.imageUrl || b.thumbnail || b.url_image || '';
          const title = b.title || '';
          const desc = b.desc || b.caption || '';

          return `
            <div class="gallery-card" onclick="onCardClick(event, '${encodeURIComponent(imageSrc)}', '${encodeURIComponent(title)}', '${encodeURIComponent(desc)}')">
              ${imageSrc 
                ? `<img src="${imageSrc}" alt="${title}" loading="lazy" onerror="handleImgError(this)">
                   <div class="gallery-card-placeholder" style="display:none;">🖼️</div>` 
                : `<div class="gallery-card-placeholder">🚀</div>`}
              <div class="gallery-caption">
                <div class="gallery-title">
                  <span>${title}</span>
                </div>
                <div class="gallery-desc">${desc}</div>
              </div>
            </div>
          `;
        }).join('');

        setupDragToScroll(gScroll);
      }
    }

    /* DRAG & SWIPE ENGINE WITH CINEMATIC WHOOSH FOR MAIN GALLERY */
    function setupDragToScroll(slider) {
      lastScrollPos = slider.scrollLeft;

      // Whoosh on drag / swipe / touch scroll
      slider.addEventListener('scroll', () => {
        const delta = Math.abs(slider.scrollLeft - lastScrollPos);
        if (delta > 35) {
          triggerWhooshSound();
          lastScrollPos = slider.scrollLeft;
        }
      });

      slider.addEventListener('mousedown', (e) => {
        getAudioContext();
        isDragging = true;
        hasDraggedDistance = false;
        slider.classList.add('active');
        startX = e.pageX - slider.offsetLeft;
        scrollLeft = slider.scrollLeft;
      });

      slider.addEventListener('mouseleave', () => {
        isDragging = false;
        slider.classList.remove('active');
      });

      slider.addEventListener('mouseup', () => {
        isDragging = false;
        slider.classList.remove('active');
      });

      slider.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - slider.offsetLeft;
        const walk = (x - startX) * 1.6; // Scroll speed multiplier
        if (Math.abs(walk) > 5) {
          hasDraggedDistance = true;
        }
        slider.scrollLeft = scrollLeft - walk;
      });
    }

    /* OPEN FULLSCREEN IMAGE VIEW ON CLICK */
    function onCardClick(e, encImg, encTitle, encDesc) {
      if (hasDraggedDistance) return; // Don't open lightbox if user was dragging
      const img = decodeURIComponent(encImg);
      const title = decodeURIComponent(encTitle);
      const desc = decodeURIComponent(encDesc);

      if (img) {
        openFullscreen(img, title, desc);
      }
    }

    function openFullscreen(imgSrc, title, desc) {
      const imgEl = document.getElementById('fullscreen-img');
      imgEl.style.display = 'block';
      imgEl.src = imgSrc;
      document.getElementById('fullscreen-title').textContent = title || '';
      document.getElementById('fullscreen-desc').textContent = desc || '';
      document.getElementById('fullscreen-modal').style.display = 'flex';
    }

    function closeFullscreen() {
      document.getElementById('fullscreen-modal').style.display = 'none';
    }

    /* =====================================================
       INSTAGRAM-STYLE STORY VIEWER ENGINE
       ===================================================== */
    const STORY_DURATION = 4500;

    let storySlides = [];
    let storyIndex = 0;
    let storyTimer = null;
    let galleryModeOn = false;
    let pointerDownAt = 0;

    function openHighlight(index) {
      const h = window.siteHighlights[index];
      if (!h || !h.slides || h.slides.length === 0) return;

      storySlides = h.slides;
      storyIndex = 0;
      galleryModeOn = false;

      const avatar = document.getElementById('story-avatar');
      avatar.style.background = h.coverImage
        ? `url('${h.coverImage}') center/cover`
        : `linear-gradient(135deg, ${h.c1 || '#8b5cf6'}, ${h.c2 || '#22d3ee'})`;
      document.getElementById('story-cat-name').textContent = h.cat || '';

      buildProgressBars();
      setGalleryMode(false);

      document.getElementById('modal').style.display = 'flex';
      document.addEventListener('keydown', handleKeydown);

      showStorySlide(0);
    }

    function buildProgressBars() {
      const row = document.getElementById('story-progress-row');
      row.innerHTML = storySlides.map((_, i) => `
        <div class="story-progress-seg"><div class="story-progress-fill" id="story-fill-${i}"></div></div>
      `).join('');
    }

    function showStorySlide(i) {
      clearTimeout(storyTimer);

      if (i < 0 || i >= storySlides.length) { closeModal(); return; }

      storyIndex = i;
      const slide = storySlides[i];

      const storyImg = document.getElementById('story-img');
      storyImg.style.display = 'block';
      storyImg.src = slide.image || '';
      document.getElementById('story-caption-title').textContent = slide.title || '';
      document.getElementById('story-caption-text').textContent = slide.caption || '';
      document.getElementById('story-slide-date').textContent = slide.date ? `Date: ${slide.date}` : '';

      storySlides.forEach((_, idx) => {
        const fill = document.getElementById('story-fill-' + idx);
        if (!fill) return;
        fill.style.transition = 'none';
        fill.style.width = idx < i ? '100%' : '0%';
      });

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const fill = document.getElementById('story-fill-' + i);
          if (fill) {
            fill.style.transition = `width ${STORY_DURATION}ms linear`;
            fill.style.width = '100%';
          }
        });
      });

      if (!galleryModeOn) {
        storyTimer = setTimeout(() => storyNext(), STORY_DURATION);
      }
    }

    function storyNext() { showStorySlide(storyIndex + 1); }
    function storyPrev() { showStorySlide(storyIndex - 1); }

    function pauseStory() {
      clearTimeout(storyTimer);
      const fill = document.getElementById('story-fill-' + storyIndex);
      if (fill) {
        const computed = getComputedStyle(fill).width;
        fill.style.transition = 'none';
        fill.style.width = computed;
      }
    }

    function resumeStory() {
      if (galleryModeOn) return;
      const fill = document.getElementById('story-fill-' + storyIndex);
      if (!fill) return;
      const seg = fill.parentElement;
      const ratioDone = seg.offsetWidth > 0 ? (fill.getBoundingClientRect().width / seg.getBoundingClientRect().width) : 0;
      const remaining = Math.max(STORY_DURATION * (1 - ratioDone), 150);

      requestAnimationFrame(() => {
        fill.style.transition = `width ${remaining}ms linear`;
        fill.style.width = '100%';
      });
      storyTimer = setTimeout(() => storyNext(), remaining);
    }

    function handleKeydown(e) {
      if (e.key === 'Escape') {
        closeModal();
        closeFullscreen();
      }
      if (document.getElementById('modal').style.display === 'flex') {
        if (e.key === 'ArrowRight') storyNext();
        else if (e.key === 'ArrowLeft') storyPrev();
      }
    }

    (function setupStoryStage() {
      const stage = document.getElementById('story-stage');
      stage.addEventListener('pointerdown', () => {
        pointerDownAt = Date.now();
        pauseStory();
      });
      stage.addEventListener('pointerup', (e) => {
        const heldFor = Date.now() - pointerDownAt;
        resumeStory();
        if (heldFor < 250) {
          const rect = stage.getBoundingClientRect();
          const x = e.clientX - rect.left;
          if (x < rect.width / 2) storyPrev();
          else storyNext();
        }
      });
      stage.addEventListener('pointerleave', () => resumeStory());
    })();

    function closeModal(e) {
      if (e) e.stopPropagation();
      document.getElementById('modal').style.display = 'none';
      clearTimeout(storyTimer);
    }

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    function toggleGalleryMode() {
      galleryModeOn = !galleryModeOn;
      setGalleryMode(galleryModeOn);
    }

    function setGalleryMode(on) {
      document.getElementById('story-stage').style.display = on ? 'none' : 'flex';
      document.getElementById('story-progress-row').style.display = on ? 'none' : 'flex';
      document.getElementById('modal-gallery-wrap').style.display = on ? 'flex' : 'none';
      const btn = document.getElementById('story-gallery-toggle');
      btn.textContent = on ? '▶' : '▦';
      btn.title = on ? 'Back to Story View' : 'View as scrollable gallery';

      if (on) {
        clearTimeout(storyTimer);
        renderHighlightGallery();
      } else {
        showStorySlide(storyIndex);
      }
    }

    function renderHighlightGallery() {
      const wrap = document.getElementById('modal-gallery-scroll');
      wrap.innerHTML = storySlides.map((s, idx) => `
        <div class="modal-gallery-photo" onclick="jumpToStorySlide(${idx})">
          <img src="${s.image || ''}" alt="${s.title || ''}" onerror="this.onerror=null; this.src=''; this.alt='Image unavailable';">
          <div class="modal-gallery-caption">${s.title || ''}</div>
        </div>
      `).join('');
    }

    function jumpToStorySlide(idx) {
      galleryModeOn = false;
      setGalleryMode(false);
      showStorySlide(idx);
    }

    function scrollHighlightGallery(dir) {
      const el = document.getElementById('modal-gallery-scroll');
      if (el) {
        el.scrollBy({ left: dir * 300, behavior: 'smooth' });
        triggerWhooshSound();
      }
    }

    loadSiteData();
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayeddie Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05060d;
      --card-bg: rgba(12, 15, 30, 0.65);
      --border-color: rgba(255, 255, 255, 0.25);
      --accent-violet: #8b5cf6;
      --accent-cyan: #22d3ee;
      --text-main: #ffffff;
      --text-muted: #c4caeb;
      --font-head: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-mono);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* VIBRANT BRIGHT FADING SLIDESHOW */
    .bg-slideshow {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background-color: #030408;
    }

    .bg-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 2.2s ease-in-out;
      transform: scale(1.01);
    }

    .bg-slide.active {
      opacity: 0.95;
    }

    /* Light minimal vignette overlay for clean readability without heavy tinting */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at center, rgba(5, 6, 13, 0.15) 0%, rgba(5, 6, 13, 0.45) 100%);
      pointer-events: none;
    }

    /* BUBBLE CANVAS BACKGROUND */
    #bubble-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: auto;
      z-index: 0;
      cursor: crosshair;
    }

    .container {
      width: 88vw;
      max-width: none;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    .container * {
      pointer-events: auto;
    }

    /* HEADER / HERO */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .pfp-wrapper {
      width: 115px;
      height: 115px;
      margin: 0 auto 1.2rem;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      box-shadow: 0 0 30px rgba(34, 211, 238, 0.5), 0 0 15px rgba(139, 92, 246, 0.5);
    }

    .pfp-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-dark);
      display: block;
    }

    .pfp-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #121526;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    h1 {
      font-family: var(--font-head);
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 2px 8px rgba(0,0,0,0.9);
      margin-bottom: 0.5rem;
    }

    p.tagline {
      color: #ffffff;
      font-size: 0.98rem;
      max-width: 550px;
      margin: 0 auto;
      line-height: 1.5;
      text-shadow: 0 1px 6px rgba(0,0,0,0.85);
      background: rgba(5, 6, 13, 0.4);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: inline-block;
    }

    /* SOCIAL LINKS HUB */
    .social-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin: 2rem 0;
    }

    .social-card {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 1.2rem;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.88rem;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .social-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-cyan);
      box-shadow: 0 6px 20px rgba(34, 211, 238, 0.35);
      background: rgba(18, 23, 48, 0.82);
    }

    .social-badge {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
    }

    /* SECTION TITLES */
    .section-title {
      font-family: var(--font-head);
      font-size: 1.35rem;
      color: var(--accent-cyan);
      margin: 2.5rem 0 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-shadow: 0 0 15px rgba(34, 211, 238, 0.7), 0 2px 6px rgba(0,0,0,0.9);
    }

    /* SLIDING GALLERY */
    .gallery-wrapper {
      position: relative;
      width: 100%;
    }

    .gallery-scroll {
      display: flex;
      align-items: flex-start;
      gap: 1.2rem;
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding: 0.5rem 0.2rem 1.2rem;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-cyan) rgba(255,255,255,0.1);
      width: 100%;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }

    .gallery-scroll.active {
      cursor: grabbing;
      scroll-behavior: auto;
      scroll-snap-type: none;
    }

    .gallery-scroll::-webkit-scrollbar { height: 6px; }
    .gallery-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 4px; }

    .gallery-card {
      min-width: 31%;
      max-width: 31%;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      scroll-snap-align: center;
      border: 1px solid var(--border-color);
      background: rgba(8, 10, 22, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      flex-shrink: 0;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      text-decoration: none;
      cursor: pointer;
      align-self: flex-start;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .gallery-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
      pointer-events: none;
    }

    .gallery-card-placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(34, 211, 238, 0.25));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      pointer-events: none;
    }

    .gallery-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-4px);
      box-shadow: 0 12px 35px rgba(0,0,0,0.8), 0 0 25px rgba(34, 211, 238, 0.35);
    }

    .gallery-card:hover img {
      transform: scale(1.04);
    }

    .gallery-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      padding: 2rem 1.2rem 1rem;
      background: linear-gradient(to top, rgba(3, 4, 10, 0.95) 20%, rgba(3, 4, 10, 0.6) 70%, transparent);
      pointer-events: none;
    }

    .gallery-title {
      font-family: var(--font-head);
      font-size: 1.15rem;
      color: #fff;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gallery-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* FULLSCREEN IMAGE LIGHTBOX MODAL */
    .fullscreen-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 4, 9, 0.95);
      backdrop-filter: blur(16px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      cursor: zoom-out;
    }

    .fullscreen-content {
      max-width: 95vw;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .fullscreen-img {
      max-width: 100%;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 40px rgba(34, 211, 238, 0.3);
    }

    .fullscreen-caption {
      margin-top: 1rem;
      text-align: center;
    }

    .fullscreen-title {
      font-family: var(--font-head);
      font-size: 1.3rem;
      color: #fff;
      margin-bottom: 0.2rem;
    }

    .fullscreen-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .fullscreen-close {
      position: absolute;
      top: -45px;
      right: 0;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      background: none;
      border: none;
      opacity: 0.8;
      transition: opacity 0.2s ease;
    }

    .fullscreen-close:hover { opacity: 1; }

    footer {
      text-align: center;
      margin-top: 4rem;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.6);
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    @media (min-width: 1800px) {
      body { padding-left: 2vw; padding-right: 2vw; }
      .container { width: 88vw; }
      header { margin-bottom: 2.5vw; }
      h1 { font-size: clamp(2.4rem, 2.2vw, 3.4rem); }
      p.tagline { max-width: 60vw; font-size: clamp(0.95rem, 0.85vw, 1.25rem); }
      .section-title { font-size: clamp(1.25rem, 1.15vw, 1.8rem); }
      .gallery-card { min-width: 31%; max-width: 31%; }
      .gallery-scroll { gap: 1.2vw; }
    }

    @media (max-width: 700px) {
      .container { width: 94vw; }
      .gallery-card { min-width: 82%; max-width: 82%; }
    }
  </style>

  <script>
    /* Image Error Handlers defined in HEAD to guarantee scope during HTML parsing */
    function handleImgError(imgElement) {
      if (!imgElement) return;

      if (!imgElement.dataset.retried) {
        imgElement.dataset.retried = 'true';
        const originalSrc = imgElement.src;
        setTimeout(() => {
          const separator = originalSrc.includes('?') ? '&' : '?';
          imgElement.src = originalSrc + separator + '_retry=' + Date.now();
        }, 500);
        return;
      }

      imgElement.style.display = 'none';
      const parentCard = imgElement.closest('.gallery-card');
      if (parentCard) {
        const placeholder = parentCard.querySelector('.gallery-card-placeholder');
        if (placeholder) placeholder.style.display = 'flex';
      }
    }

    function handlePfpError(img) {
      if (!img) return;
      img.style.display = 'none';
      const fallback = document.getElementById('pfp-fallback');
      if (fallback) fallback.style.display = 'flex';
    }

    function handleFullscreenImgError(img) {
      if (img) img.style.display = 'none';
    }
  </script>
</head>
<body>

  <!-- BRIGHT FRUTIGER BACKGROUND SLIDESHOW -->
  <div class="bg-slideshow">

  <script>
    (function applyReadableZoomOut() {
      function updateReadableZoom() {
        const dpr = window.devicePixelRatio || 1;
        let factor = 1;

        if (dpr < 0.9) {
          factor = Math.min(2, 1 / Math.sqrt(dpr));
        }

        document.documentElement.style.setProperty('--readable-zoom', factor);
        document.body.style.zoom = factor;
      }

      updateReadableZoom();
      window.addEventListener('resize', updateReadableZoom, { passive: true });
    })();
  </script>

  <div class="container">

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    /* =====================================================
       BACKGROUND IMAGE FADING LOOP ENGINE
       ===================================================== */
    (function initBackgroundSlideshow() {
      const slides = document.querySelectorAll('.bg-slide');
      if (slides.length <= 1) return;
      let currentSlide = 0;

      setInterval(() => {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
      }, 5500);
    })();

    /* =====================================================
       ALWAYS-ON AUTOMATIC BACKGROUND MUSIC ENGINE
       ===================================================== */
    const bgMusic = document.getElementById('bg-music');
    bgMusic.volume = 0.45;

    function startMusic() {
      if (bgMusic.paused) {
        bgMusic.play().catch(() => {});
      }
    }

    // Try auto-play immediately on script load
    startMusic();

    // Ensure music always starts seamlessly on first user interaction
    ['pointerdown', 'touchstart', 'click', 'keydown', 'scroll'].forEach(evt => {
      window.addEventListener(evt, startMusic, { passive: true });
    });

    /* =====================================================
       ZERO-LATENCY WEB AUDIO POP SYNTHESIZER ENGINE
       ===================================================== */
    let audioCtx = null;
    let lastPopSoundTime = 0;
    let lastWhooshSoundTime = 0;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    window.addEventListener('pointerdown', getAudioContext, { once: true });
    window.addEventListener('keydown', getAudioContext, { once: true });

    function triggerPopSound() {
      const now = Date.now();
      if (now - lastPopSoundTime < 25) return;
      lastPopSoundTime = now;

      const ctx = getAudioContext();
      if (!ctx) return;

      const currentTime = ctx.currentTime;

      // Bright popping synth drop
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      const baseFreq = 480 + Math.random() * 320;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq, currentTime);
      osc.frequency.exponentialRampToValueAtTime(70, currentTime + 0.08);

      gain.gain.setValueAtTime(0.85, currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, currentTime + 0.08);

      osc.connect(gain);

      // Pop snap transient
      const bufferSize = ctx.sampleRate * 0.018;
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;

      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'highpass';
      noiseFilter.frequency.value = 2200;

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.5, currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, currentTime + 0.02);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);

      gain.connect(ctx.destination);
      noiseGain.connect(ctx.destination);

      osc.start(currentTime);
      noise.start(currentTime);
      osc.stop(currentTime + 0.09);
      noise.stop(currentTime + 0.025);
    }

    function triggerWhooshSound() {
      const now = Date.now();
      if (now - lastWhooshSoundTime < 180) return;
      lastWhooshSoundTime = now;

      const ctx = getAudioContext();
      if (!ctx) return;

      const currentTime = ctx.currentTime;
      const duration = 0.22;

      const bufferSize = ctx.sampleRate * duration;
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        output[i] *= 0.11;
        b6 = white * 0.115926;
      }

      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.Q.value = 4.0;
      filter.frequency.setValueAtTime(120, currentTime);
      filter.frequency.exponentialRampToValueAtTime(1400, currentTime + duration * 0.5);
      filter.frequency.exponentialRampToValueAtTime(80, currentTime + duration);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.01, currentTime);
      gain.gain.linearRampToValueAtTime(0.5, currentTime + duration * 0.4);
      gain.gain.exponentialRampToValueAtTime(0.001, currentTime + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      noise.start(currentTime);
      noise.stop(currentTime + duration);
    }

    /* =====================================================
       PHYSICS BUBBLE ENGINE WITH POPPING PARTICLES & SOUND
       ===================================================== */
    (function initInteractiveBubbles() {
      const canvas = document.getElementById('bubble-canvas');
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      const mouse = {
        x: -1000,
        y: -1000,
        radius: 190,
        isActive: false
      };

      const popRings = [];
      const popParticles = [];

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const trackPointer = (x, y) => {
        mouse.x = x;
        mouse.y = y;
        mouse.isActive = true;
      };

      window.addEventListener('mousemove', (e) => trackPointer(e.clientX, e.clientY));
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          trackPointer(e.touches[0].clientX, e.touches[0].clientY);
        }
      });

      window.addEventListener('mouseleave', () => { mouse.isActive = false; });
      window.addEventListener('touchend', () => { mouse.isActive = false; });

      class PopParticle {
        constructor(x, y, hue) {
          this.x = x;
          this.y = y;
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 5 + 2;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = Math.random() * 4 + 2;
          this.hue = hue;
          this.alpha = 1.0;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.alpha -= 0.045;
        }

        draw() {
          if (this.alpha <= 0) return;
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${this.hue}, 100%, 85%, ${this.alpha})`;
          ctx.fill();
          ctx.restore();
        }
      }

      class PopRing {
        constructor(x, y, radius, hue) {
          this.x = x;
          this.y = y;
          this.radius = radius;
          this.currentRadius = radius * 0.4;
          this.maxRadius = radius * 2.4;
          this.hue = hue;
          this.alpha = 0.95;
        }

        update() {
          this.currentRadius += (this.maxRadius - this.currentRadius) * 0.32;
          this.alpha -= 0.065;
        }

        draw() {
          if (this.alpha <= 0) return;
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${this.hue}, 100%, 80%, ${this.alpha})`;
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.restore();
        }
      }

      class Bubble {
        constructor() {
          this.reset(true);
        }

        reset(initial = false) {
          this.radius = Math.random() * 28 + 12;
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : height + this.radius + Math.random() * 60;
          
          this.vx = (Math.random() - 0.5) * 0.9;
          this.vy = -Math.random() * 1.1 - 0.4;
          
          this.baseVx = this.vx;
          this.baseVy = this.vy;
          
          this.alpha = Math.random() * 0.5 + 0.4;
          // Frutiger palette hues: cyan (190), violet/magenta (280), aqua (170)
          const hues = [190, 280, 170, 210];
          this.hue = hues[Math.floor(Math.random() * hues.length)];
          this.cooldown = 0;
        }

        pop() {
          triggerPopSound();
          popRings.push(new PopRing(this.x, this.y, this.radius, this.hue));
          
          for (let i = 0; i < 8; i++) {
            popParticles.push(new PopParticle(this.x, this.y, this.hue));
          }

          this.reset(false);
        }

        update() {
          if (this.cooldown > 0) this.cooldown--;

          this.x += this.vx;
          this.y += this.vy;

          this.vx += (this.baseVx - this.vx) * 0.03;
          this.vy += (this.baseVy - this.vy) * 0.03;

          if (mouse.isActive) {
            const dx = this.x - mouse.x;
            const dy = this.y - mouse.y;
            const dist = Math.hypot(dx, dy);

            if (dist < mouse.radius) {
              const force = (mouse.radius - dist) / mouse.radius;
              const angle = Math.atan2(dy, dx);
              const push = force * 7.5;

              this.vx += Math.cos(angle) * push * 0.35;
              this.vy += Math.sin(angle) * push * 0.35;

              // Pop when cursor/touch is right over the bubble center
              if (dist < this.radius + 16 && this.cooldown === 0) {
                this.pop();
                return;
              }
            }
          }

          if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -0.8; }
          if (this.x + this.radius > width) { this.x = width - this.radius; this.vx *= -0.8; }

          if (this.y + this.radius < -20) {
            this.reset(false);
          }
        }

        draw() {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

          const grad = ctx.createRadialGradient(
            this.x - this.radius * 0.3,
            this.y - this.radius * 0.3,
            this.radius * 0.1,
            this.x,
            this.y,
            this.radius
          );

          grad.addColorStop(0, `hsla(${this.hue}, 100%, 90%, ${this.alpha * 0.85})`);
          grad.addColorStop(0.55, `hsla(${this.hue}, 90%, 65%, ${this.alpha * 0.45})`);
          grad.addColorStop(1, `hsla(${this.hue}, 90%, 50%, 0.1)`);

          ctx.fillStyle = grad;
          ctx.fill();

          ctx.strokeStyle = `hsla(${this.hue}, 100%, 80%, ${this.alpha * 0.85})`;
          ctx.lineWidth = 1.6;
          ctx.stroke();

          // High-contrast highlight spec
          ctx.beginPath();
          ctx.arc(this.x - this.radius * 0.35, this.y - this.radius * 0.35, this.radius * 0.25, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.85})`;
          ctx.fill();

          ctx.restore();
        }
      }

      const bubbleCount = Math.floor(Math.min(window.innerWidth / 14, 60));
      const bubbles = Array.from({ length: bubbleCount }, () => new Bubble());

      // Tap / Click anywhere on window to pop nearest bubble
      window.addEventListener('pointerdown', (e) => {
        getAudioContext();
        startMusic();
        const clickX = e.clientX;
        const clickY = e.clientY;

        for (let b of bubbles) {
          const dist = Math.hypot(b.x - clickX, b.y - clickY);
          if (dist < b.radius + 22) {
            b.pop();
            break;
          }
        }
      });

      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (let i = popRings.length - 1; i >= 0; i--) {
          popRings[i].update();
          popRings[i].draw();
          if (popRings[i].alpha <= 0) {
            popRings.splice(i, 1);
          }
        }

        for (let i = popParticles.length - 1; i >= 0; i--) {
          popParticles[i].update();
          popParticles[i].draw();
          if (popParticles[i].alpha <= 0) {
            popParticles.splice(i, 1);
          }
        }

        bubbles.forEach(b => {
          b.update();
          b.draw();
        });
        requestAnimationFrame(animate);
      }

      animate();
    })();

    let isDragging = false;
    let startX, scrollLeft;
    let hasDraggedDistance = false;
    let lastScrollPos = 0;

    async function loadSiteData() {
      let data = {};
      try {
        const res = await fetch('data.json');
        const contentType = res.headers.get('content-type') || '';
        if (res.ok && contentType.includes('json')) {
          data = await res.json();
        }
      } catch (e) {}

      const pfp = localStorage.getItem('aayeddie_pfp') || (data.profile && data.profile.pfp) || data.pfp;
      const title = localStorage.getItem('aayeddie_hero_title') || (data.profile && data.profile.hero && data.profile.hero.title) || (data.hero && data.hero.title) || 'aayeddie';
      const tagline = localStorage.getItem('aayeddie_hero_tagline') || (data.profile && data.profile.hero && data.profile.hero.tagline) || (data.hero && data.tagline) || '';

      if (pfp) {
        const img = document.getElementById('pfp-img');
        img.src = pfp;
        img.style.display = 'block';
        document.getElementById('pfp-fallback').style.display = 'none';
      }

      document.getElementById('hero-title').textContent = title;
      document.getElementById('hero-tagline').textContent = tagline;

      // Socials
      const socialsData = localStorage.getItem('aayeddie_custom_socials');
      const socials = socialsData ? JSON.parse(socialsData) : (data.socials || []);
      document.getElementById('socials-grid').innerHTML = socials.map(s => `
        <a class="social-card" href="${s.url}" target="_blank" rel="noopener">
          <div class="social-badge" style="background:${s.color || 'var(--accent-violet)'}">${s.init || s.name[0]}</div>
          <div>
            <div style="font-weight:600;">${s.name}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">${s.handle}</div>
          </div>
        </a>
      `).join('');

      // Builds / Gallery
      const buildsData = localStorage.getItem('aayeddie_custom_builds');
      const builds = buildsData ? JSON.parse(buildsData) : (data.builds || []);
      const galleryData = localStorage.getItem('aayeddie_custom_gallery');
      const gallery = galleryData ? JSON.parse(galleryData) : (data.gallery || []);

      const items = builds.length > 0 ? builds : gallery;
      renderCardScroller(items, 'gallery-section', 'main-gallery-scroll');

      // Photography
      const photographyData = localStorage.getItem('aayeddie_custom_photography');
      const photography = photographyData ? JSON.parse(photographyData) : (data.photography || []);
      renderCardScroller(photography, 'photography-section', 'photography-gallery-scroll');
    }

    function renderCardScroller(items, sectionId, scrollId) {
      if (!items || items.length === 0) return;

      document.getElementById(sectionId).style.display = 'block';
      const scrollEl = document.getElementById(scrollId);

      scrollEl.innerHTML = items.map((b) => {
        const imageSrc = b.imageUrl || b.image || b.img || b.cover || b.thumbnail || b.url_image || '';
        const title = b.title || '';
        const desc = b.desc || b.caption || '';

        return `
          <div class="gallery-card" onclick="onCardClick(event, '${encodeURIComponent(imageSrc)}', '${encodeURIComponent(title)}', '${encodeURIComponent(desc)}')">
            ${imageSrc 
              ? `<img src="${imageSrc}" alt="${title}" loading="lazy" onerror="handleImgError(this)">
                 <div class="gallery-card-placeholder" style="display:none;">🖼️</div>` 
              : `<div class="gallery-card-placeholder">🚀</div>`}
            <div class="gallery-caption">
              <div class="gallery-title">
                <span>${title}</span>
              </div>
              <div class="gallery-desc">${desc}</div>
            </div>
          </div>
        `;
      }).join('');

      setupDragToScroll(scrollEl);
    }

    function setupDragToScroll(slider) {
      lastScrollPos = slider.scrollLeft;

      slider.addEventListener('scroll', () => {
        const delta = Math.abs(slider.scrollLeft - lastScrollPos);
        if (delta > 35) {
          triggerWhooshSound();
          lastScrollPos = slider.scrollLeft;
        }
      });

      slider.addEventListener('mousedown', (e) => {
        getAudioContext();
        startMusic();
        isDragging = true;
        hasDraggedDistance = false;
        slider.classList.add('active');
        startX = e.pageX - slider.offsetLeft;
        scrollLeft = slider.scrollLeft;
      });

      slider.addEventListener('mouseleave', () => {
        isDragging = false;
        slider.classList.remove('active');
      });

      slider.addEventListener('mouseup', () => {
        isDragging = false;
        slider.classList.remove('active');
      });

      slider.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - slider.offsetLeft;
        const walk = (x - startX) * 1.6;
        if (Math.abs(walk) > 5) {
          hasDraggedDistance = true;
        }
        slider.scrollLeft = scrollLeft - walk;
      });
    }

    function onCardClick(e, encImg, encTitle, encDesc) {
      if (hasDraggedDistance) return;
      const img = decodeURIComponent(encImg);
      const title = decodeURIComponent(encTitle);
      const desc = decodeURIComponent(encDesc);

      if (img) {
        openFullscreen(img, title, desc);
      }
    }

    function openFullscreen(imgSrc, title, desc) {
      const imgEl = document.getElementById('fullscreen-img');
      imgEl.style.display = 'block';
      imgEl.src = imgSrc;
      document.getElementById('fullscreen-title').textContent = title || '';
      document.getElementById('fullscreen-desc').textContent = desc || '';
      document.getElementById('fullscreen-modal').style.display = 'flex';
    }

    function closeFullscreen() {
      document.getElementById('fullscreen-modal').style.display = 'none';
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeFullscreen();
      }
    });

    loadSiteData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayeddie Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05060d;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-violet: #8b5cf6;
      --accent-cyan: #22d3ee;
      --text-main: #f5f3ff;
      --text-muted: #9ca3c9;
      --font-head: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-mono);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    /* HEADER / HERO */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .pfp-wrapper {
      width: 110px;
      height: 110px;
      margin: 0 auto 1.2rem;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
    }

    .pfp-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-dark);
      display: block;
    }

    .pfp-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #121526;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    h1 {
      font-family: var(--font-head);
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p.tagline {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 550px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* SOCIAL LINKS HUB */
    .social-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin: 2rem 0;
    }

    .social-card {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1.1rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .social-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-cyan);
      box-shadow: 0 4px 15px rgba(34, 211, 238, 0.15);
    }

    .social-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
    }

    /* HIGHLIGHT RINGS */
    .section-title {
      font-family: var(--font-head);
      font-size: 1.25rem;
      color: var(--accent-cyan);
      margin: 2.5rem 0 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .highlights-scroll {
      display: flex;
      gap: 1.2rem;
      overflow-x: auto;
      padding-bottom: 0.8rem;
      scrollbar-width: thin;
    }

    .highlight-ring {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-width: 80px;
    }

    .ring-outer {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .highlight-ring:hover .ring-outer {
      transform: scale(1.08);
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.55), 0 0 34px rgba(34, 211, 238, 0.35);
    }

    .ring-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      overflow: hidden;
    }

    .ring-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ring-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      text-align: center;
    }

    /* BUILDS SHOWCASE */
    .builds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .build-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .build-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-3px);
      box-shadow: 0 0 22px rgba(139, 92, 246, 0.3), 0 0 40px rgba(34, 211, 238, 0.18);
    }

    .build-title {
      font-family: var(--font-head);
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
      color: #fff;
    }

    .build-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 1rem;
    }

    .build-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8rem;
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 600;
    }

    .build-link:hover {
      text-decoration: underline;
    }

    /* ============================= */
    /* INSTAGRAM-STYLE STORY VIEWER  */
    /* ============================= */
    .story-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 13, 0.96);
      backdrop-filter: blur(10px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 1.2rem;
    }

    .story-content {
      width: 100%;
      max-width: 420px;
      height: min(88vh, 780px);
      background: #0a0b16;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }

    /* progress segments */
    .story-progress-row {
      display: flex;
      gap: 4px;
      padding: 10px 12px 0;
      flex-shrink: 0;
    }
    .story-progress-seg {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.25);
      overflow: hidden;
    }
    .story-progress-fill {
      height: 100%;
      width: 0%;
      background: #fff;
    }

    /* header row */
    .story-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 10px 12px;
      flex-shrink: 0;
    }
    .story-ring-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }
    .story-header-text { flex: 1; min-width: 0; }
    .story-cat-name {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 0.85rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .story-slide-date {
      font-size: 0.68rem;
      color: var(--text-muted);
    }
    .story-gallery-btn, .story-close-btn {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .story-gallery-btn:hover, .story-close-btn:hover {
      background: rgba(255,255,255,0.18);
      transform: scale(1.08);
    }

    /* main story stage (the actual "play like instagram" surface) */
    .story-stage {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: pointer;
    }
    .story-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }
    .story-caption-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 1.6rem 1rem 1rem;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      pointer-events: none;
    }
    .story-caption-title {
      font-family: var(--font-head);
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 0.2rem;
    }
    .story-caption-text {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .story-empty-msg {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 2rem;
    }

    /* =============================================== */
    /* "OWN PHOTO GALLERY" — horizontal scroll mode      */
    /* =============================================== */
    .gallery-scroll-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.5rem 0.3rem;
      overflow: hidden;
    }
    .gallery-scroll {
      flex: 1;
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      padding: 0.8rem 0.6rem;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-cyan) rgba(255,255,255,0.05);
      height: 100%;
      align-items: center;
    }
    .gallery-scroll::-webkit-scrollbar { height: 7px; }
    .gallery-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 4px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 4px; }

    .gallery-nav {
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }
    .gallery-nav:hover { background: rgba(255,255,255,0.2); }

    .gallery-photo {
      position: relative;
      min-width: 78%;
      max-width: 78%;
      height: 92%;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
      scroll-snap-align: center;
      border: 2px solid transparent;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      background: #000;
    }
    .gallery-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .gallery-photo-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0.6rem 0.7rem;
      font-size: 0.72rem;
      color: #fff;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    }

    /* Enhanced hover glow (general) */
    .gallery-photo:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 32px rgba(0,0,0,0.6), 0 0 26px rgba(139,92,246,0.45);
    }

    /* Rainbow glow — specifically for gallery photos */
    .rainbow-glow { position: relative; z-index: 0; }
    .rainbow-glow::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 18px;
      z-index: -1;
      background: conic-gradient(from 0deg, #ff2e2e, #ffcc33, #33ff77, #22d3ee, #8b5cf6, #ff2e9a, #ff2e2e);
      opacity: 0;
      filter: blur(12px);
      transition: opacity 0.35s ease;
      animation: rainbow-spin 4s linear infinite;
    }
    .rainbow-glow:hover::before { opacity: 0.95; }
    @keyframes rainbow-spin {
      to { transform: rotate(360deg); }
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
    }

    @media (max-width: 480px) {
      .story-content { height: 92vh; border-radius: 14px; }
      .gallery-photo { min-width: 88%; max-width: 88%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="pfp-wrapper">
        <img id="pfp-img" class="pfp-img" src="" alt="Profile Picture" style="display:none;">
        <div id="pfp-fallback" class="pfp-fallback">⚡</div>
      </div>
      <h1 id="hero-title">aayeddie</h1>
      <p id="hero-tagline" class="tagline">Builder of small worlds — apps, games, and things that glow.</p>

      <div id="socials-grid" class="social-grid"></div>
    </header>

    <section id="highlights-section" style="display:none;">
      <h2 class="section-title">✨ Highlights</h2>
      <div id="highlights-scroll" class="highlights-scroll"></div>
    </section>

    <section id="builds-section" style="display:none;">
      <h2 class="section-title">🚀 Featured Builds</h2>
      <div id="builds-grid" class="builds-grid"></div>
    </section>

    <footer>
      <p>© <span id="year"></span> @aayeddie. All rights reserved.</p>
    </footer>
  </div>

  <!-- INSTAGRAM-STYLE STORY / GALLERY MODAL -->
  <div id="modal" class="story-modal">
    <div class="story-content" onclick="event.stopPropagation()">

      <div class="story-progress-row" id="story-progress-row"></div>

      <div class="story-header">
        <div class="story-ring-avatar" id="story-avatar"></div>
        <div class="story-header-text">
          <div class="story-cat-name" id="story-cat-name"></div>
          <div class="story-slide-date" id="story-slide-date"></div>
        </div>
        <button class="story-gallery-btn" id="story-gallery-toggle" onclick="toggleGalleryMode()" title="View as scrollable gallery">▦</button>
        <button class="story-close-btn" onclick="closeModal()" title="Close">&times;</button>
      </div>

      <div class="story-stage" id="story-stage">
        <img id="story-img" class="story-img" src="" alt="Highlight slide">
        <div class="story-caption-wrap">
          <div class="story-caption-title" id="story-caption-title"></div>
          <div class="story-caption-text" id="story-caption-text"></div>
        </div>
      </div>

      <div class="gallery-scroll-wrap" id="gallery-scroll-wrap" style="display:none;">
        <button class="gallery-nav" onclick="scrollHighlightGallery(-1)">‹</button>
        <div class="gallery-scroll" id="gallery-scroll"></div>
        <button class="gallery-nav" onclick="scrollHighlightGallery(1)">›</button>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    async function loadSiteData() {
      let data = {};
      try {
        const res = await fetch('data.json');
        const contentType = res.headers.get('content-type') || '';
        if (res.ok && contentType.includes('json')) {
          data = await res.json();
        } else {
          // No data.json deployed yet (or server returned an HTML fallback page) —
          // this is expected until you add one, so we just use defaults/localStorage.
        }
      } catch (e) {
        // Network/parse hiccup — silently fall back to defaults/localStorage.
      }

      // Check localStorage for overrides
      const pfp = localStorage.getItem('aayeddie_pfp') || data.pfp;
      const title = localStorage.getItem('aayeddie_hero_title') || (data.hero && data.hero.title) || 'aayeddie';
      const tagline = localStorage.getItem('aayeddie_hero_tagline') || (data.hero && data.hero.tagline) || '';

      // Set PFP
      if (pfp) {
        const img = document.getElementById('pfp-img');
        img.src = pfp;
        img.style.display = 'block';
        document.getElementById('pfp-fallback').style.display = 'none';
      }

      // Set Hero Text
      document.getElementById('hero-title').textContent = title;
      document.getElementById('hero-tagline').textContent = tagline;

      // Set Socials
      const socialsData = localStorage.getItem('aayeddie_custom_socials');
      const socials = socialsData ? JSON.parse(socialsData) : (data.socials || []);
      const socialsGrid = document.getElementById('socials-grid');

      socialsGrid.innerHTML = socials.map(s => `
        <a class="social-card" href="${s.url}" target="_blank" rel="noopener">
          <div class="social-badge" style="background:${s.color || 'var(--accent-violet)'}">${s.init || s.name[0]}</div>
          <div>
            <div style="font-weight:600;">${s.name}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">${s.handle}</div>
          </div>
        </a>
      `).join('');

      // Set Highlights
      const highlightsData = localStorage.getItem('aayeddie_custom_highlights');
      const highlights = highlightsData ? JSON.parse(highlightsData) : (data.highlights || []);
      if (highlights.length > 0) {
        document.getElementById('highlights-section').style.display = 'block';
        const hScroll = document.getElementById('highlights-scroll');
        hScroll.innerHTML = highlights.map((h, index) => `
          <div class="highlight-ring" onclick="openHighlight(${index})">
            <div class="ring-outer" style="background: linear-gradient(135deg, ${h.c1 || '#8b5cf6'}, ${h.c2 || '#22d3ee'});">
              <div class="ring-inner">
                ${h.coverImage ? `<img src="${h.coverImage}" alt="${h.cat}">` : `<span>${h.icon || '⭐'}</span>`}
              </div>
            </div>
            <span class="ring-label">${h.cat}</span>
          </div>
        `).join('');
        window.siteHighlights = highlights;
      }

      // Set Builds
      const buildsData = localStorage.getItem('aayeddie_custom_builds');
      const builds = buildsData ? JSON.parse(buildsData) : (data.builds || []);
      if (builds.length > 0) {
        document.getElementById('builds-section').style.display = 'block';
        const bGrid = document.getElementById('builds-grid');
        bGrid.innerHTML = builds.map(b => `
          <div class="build-card">
            <div>
              <div class="build-title">${b.title}</div>
              <div class="build-desc">${b.desc || ''}</div>
            </div>
            ${b.url && b.url !== '#' ? `<a class="build-link" href="${b.url}" target="_blank" rel="noopener">View Build →</a>` : ''}
          </div>
        `).join('');
      }
    }

    /* =====================================================
       INSTAGRAM-STYLE STORY VIEWER ENGINE
       ===================================================== */
    const STORY_DURATION = 4500; // ms per slide

    let storySlides = [];
    let storyIndex = 0;
    let storyTimer = null;
    let galleryModeOn = false;
    let pointerDownAt = 0;

    function openHighlight(index) {
      const h = window.siteHighlights[index];
      if (!h || !h.slides || h.slides.length === 0) return;

      storySlides = h.slides;
      storyIndex = 0;
      galleryModeOn = false;

      const avatar = document.getElementById('story-avatar');
      avatar.style.background = h.coverImage
        ? `url('${h.coverImage}') center/cover`
        : `linear-gradient(135deg, ${h.c1 || '#8b5cf6'}, ${h.c2 || '#22d3ee'})`;
      document.getElementById('story-cat-name').textContent = h.cat || '';

      buildProgressBars();
      setGalleryMode(false);

      document.getElementById('modal').style.display = 'flex';
      document.addEventListener('keydown', handleStoryKeydown);

      showStorySlide(0);
    }

    function buildProgressBars() {
      const row = document.getElementById('story-progress-row');
      row.innerHTML = storySlides.map((_, i) => `
        <div class="story-progress-seg"><div class="story-progress-fill" id="story-fill-${i}"></div></div>
      `).join('');
    }

    function showStorySlide(i) {
      clearTimeout(storyTimer);

      if (i < 0) { closeModal(); return; }
      if (i >= storySlides.length) { closeModal(); return; }

      storyIndex = i;
      const slide = storySlides[i];

      document.getElementById('story-img').src = slide.image || '';
      document.getElementById('story-caption-title').textContent = slide.title || '';
      document.getElementById('story-caption-text').textContent = slide.caption || '';
      document.getElementById('story-slide-date').textContent = slide.date ? `Date: ${slide.date}` : '';

      // Reset all progress fills instantly (no transition)
      storySlides.forEach((_, idx) => {
        const fill = document.getElementById('story-fill-' + idx);
        if (!fill) return;
        fill.style.transition = 'none';
        fill.style.width = idx < i ? '100%' : '0%';
      });

      // Animate the current segment filling over STORY_DURATION
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const fill = document.getElementById('story-fill-' + i);
          if (fill) {
            fill.style.transition = `width ${STORY_DURATION}ms linear`;
            fill.style.width = '100%';
          }
        });
      });

      if (!galleryModeOn) {
        storyTimer = setTimeout(() => storyNext(), STORY_DURATION);
      }
    }

    function storyNext() { showStorySlide(storyIndex + 1); }
    function storyPrev() { showStorySlide(storyIndex - 1); }

    function pauseStory() {
      clearTimeout(storyTimer);
      const fill = document.getElementById('story-fill-' + storyIndex);
      if (fill) {
        const computed = getComputedStyle(fill).width;
        fill.style.transition = 'none';
        fill.style.width = computed;
      }
    }

    function resumeStory() {
      if (galleryModeOn) return;
      const fill = document.getElementById('story-fill-' + storyIndex);
      if (!fill) return;
      const seg = fill.parentElement;
      const ratioDone = seg.offsetWidth > 0 ? (fill.getBoundingClientRect().width / seg.getBoundingClientRect().width) : 0;
      const remaining = Math.max(STORY_DURATION * (1 - ratioDone), 150);

      requestAnimationFrame(() => {
        fill.style.transition = `width ${remaining}ms linear`;
        fill.style.width = '100%';
      });
      storyTimer = setTimeout(() => storyNext(), remaining);
    }

    function handleStoryKeydown(e) {
      if (document.getElementById('modal').style.display !== 'flex') return;
      if (e.key === 'ArrowRight') storyNext();
      else if (e.key === 'ArrowLeft') storyPrev();
      else if (e.key === 'Escape') closeModal();
    }

    // Tap-to-advance / hold-to-pause on the story stage (works for mouse + touch)
    (function setupStoryStage() {
      const stage = document.getElementById('story-stage');
      stage.addEventListener('pointerdown', (e) => {
        pointerDownAt = Date.now();
        pauseStory();
      });
      stage.addEventListener('pointerup', (e) => {
        const heldFor = Date.now() - pointerDownAt;
        resumeStory();
        if (heldFor < 250) {
          const rect = stage.getBoundingClientRect();
          const x = e.clientX - rect.left;
          if (x < rect.width / 2) storyPrev();
          else storyNext();
        }
      });
      stage.addEventListener('pointerleave', () => resumeStory());
    })();

    function closeModal(e) {
      if (e) e.stopPropagation();
      document.getElementById('modal').style.display = 'none';
      clearTimeout(storyTimer);
      document.removeEventListener('keydown', handleStoryKeydown);
    }

    // Close when clicking the dark backdrop
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    /* =====================================================
       "OWN PHOTO GALLERY" MODE — big scrollable photo strip
       ===================================================== */
    function toggleGalleryMode() {
      galleryModeOn = !galleryModeOn;
      setGalleryMode(galleryModeOn);
    }

    function setGalleryMode(on) {
      document.getElementById('story-stage').style.display = on ? 'none' : 'flex';
      document.getElementById('story-progress-row').style.display = on ? 'none' : 'flex';
      document.getElementById('gallery-scroll-wrap').style.display = on ? 'flex' : 'none';
      const btn = document.getElementById('story-gallery-toggle');
      btn.textContent = on ? '▶' : '▦';
      btn.title = on ? 'Back to Story View' : 'View as scrollable gallery';

      if (on) {
        clearTimeout(storyTimer);
        renderHighlightGallery();
      } else {
        showStorySlide(storyIndex);
      }
    }

    function renderHighlightGallery() {
      const wrap = document.getElementById('gallery-scroll');
      wrap.innerHTML = storySlides.map((s, idx) => `
        <div class="gallery-photo rainbow-glow" onclick="jumpToStorySlide(${idx})">
          <img src="${s.image || ''}" alt="${s.title || ''}">
          <div class="gallery-photo-caption">${s.title || ''}</div>
        </div>
      `).join('');
    }

    function jumpToStorySlide(idx) {
      galleryModeOn = false;
      setGalleryMode(false);
      showStorySlide(idx);
    }

    function scrollHighlightGallery(dir) {
      const el = document.getElementById('gallery-scroll');
      if (el) el.scrollBy({ left: dir * 300, behavior: 'smooth' });
    }

    loadSiteData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aayeddie Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05060d;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-violet: #8b5cf6;
      --accent-cyan: #22d3ee;
      --text-main: #f5f3ff;
      --text-muted: #9ca3c9;
      --font-head: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-mono);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    /* HEADER / HERO */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .pfp-wrapper {
      width: 110px;
      height: 110px;
      margin: 0 auto 1.2rem;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.3);
    }

    .pfp-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-dark);
      display: block;
    }

    .pfp-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #121526;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    h1 {
      font-family: var(--font-head);
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p.tagline {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 550px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* SOCIAL LINKS HUB */
    .social-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin: 2rem 0;
    }

    .social-card {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1.1rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .social-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-cyan);
      box-shadow: 0 4px 15px rgba(34, 211, 238, 0.15);
    }

    .social-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
    }

    /* HIGHLIGHT RINGS */
    .section-title {
      font-family: var(--font-head);
      font-size: 1.25rem;
      color: var(--accent-cyan);
      margin: 2.5rem 0 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .highlights-scroll {
      display: flex;
      gap: 1.2rem;
      overflow-x: auto;
      padding-bottom: 0.8rem;
      scrollbar-width: thin;
    }

    .highlight-ring {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-width: 80px;
    }

    .ring-outer {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      transition: transform 0.2s ease;
    }

    .ring-outer:hover {
      transform: scale(1.06);
    }

    .ring-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      overflow: hidden;
    }

    .ring-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ring-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      text-align: center;
    }

    /* BUILDS SHOWCASE */
    .builds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .build-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .build-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-3px);
    }

    .build-title {
      font-family: var(--font-head);
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
      color: #fff;
    }

    .build-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 1rem;
    }

    .build-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8rem;
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 600;
    }

    .build-link:hover {
      text-decoration: underline;
    }

    /* SLIDE MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 13, 0.92);
      backdrop-filter: blur(8px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .modal-content {
      background: #0d0f1f;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 15px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-slide-img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 1rem;
      display: none;
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="pfp-wrapper">
        <img id="pfp-img" class="pfp-img" src="" alt="Profile Picture" style="display:none;">
        <div id="pfp-fallback" class="pfp-fallback">⚡</div>
      </div>
      <h1 id="hero-title">aayeddie</h1>
      <p id="hero-tagline" class="tagline">Builder of small worlds — apps, games, and things that glow.</p>

      <div id="socials-grid" class="social-grid"></div>
    </header>

    <section id="highlights-section" style="display:none;">
      <h2 class="section-title">✨ Highlights</h2>
      <div id="highlights-scroll" class="highlights-scroll"></div>
    </section>

    <section id="builds-section" style="display:none;">
      <h2 class="section-title">🚀 Featured Builds</h2>
      <div id="builds-grid" class="builds-grid"></div>
    </section>

    <footer>
      <p>© <span id="year"></span> @aayeddie. All rights reserved.</p>
    </footer>
  </div>

  <div id="modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-body">
        <img id="modal-img" class="modal-slide-img" src="" alt="Slide">
        <h3 id="modal-title" style="color:#fff; font-family:var(--font-head); margin-bottom:0.4rem;"></h3>
        <p id="modal-caption" style="color:var(--text-muted); font-size:0.85rem; line-height:1.4;"></p>
        <div id="modal-date" style="color:var(--accent-cyan); font-size:0.75rem; margin-top:0.8rem;"></div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    async function loadSiteData() {
      let data = {};
      try {
        const res = await fetch('data.json');
        data = await res.json();
      } catch (e) {
        console.warn("data.json failed to load, falling back to defaults/localStorage.", e);
      }

      // Check localStorage for overrides
      const pfp = localStorage.getItem('aayeddie_pfp') || data.pfp;
      const title = localStorage.getItem('aayeddie_hero_title') || (data.hero && data.hero.title) || 'aayeddie';
      const tagline = localStorage.getItem('aayeddie_hero_tagline') || (data.hero && data.hero.tagline) || '';

      // Set PFP
      if (pfp) {
        const img = document.getElementById('pfp-img');
        img.src = pfp;
        img.style.display = 'block';
        document.getElementById('pfp-fallback').style.display = 'none';
      }

      // Set Hero Text
      document.getElementById('hero-title').textContent = title;
      document.getElementById('hero-tagline').textContent = tagline;

      // Set Socials
      const socialsData = localStorage.getItem('aayeddie_custom_socials');
      const socials = socialsData ? JSON.parse(socialsData) : (data.socials || []);
      const socialsGrid = document.getElementById('socials-grid');
      
      socialsGrid.innerHTML = socials.map(s => `
        <a class="social-card" href="${s.url}" target="_blank" rel="noopener">
          <div class="social-badge" style="background:${s.color || 'var(--accent-violet)'}">${s.init || s.name[0]}</div>
          <div>
            <div style="font-weight:600;">${s.name}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">${s.handle}</div>
          </div>
        </a>
      `).join('');

      // Set Highlights
      const highlightsData = localStorage.getItem('aayeddie_custom_highlights');
      const highlights = highlightsData ? JSON.parse(highlightsData) : (data.highlights || []);
      if (highlights.length > 0) {
        document.getElementById('highlights-section').style.display = 'block';
        const hScroll = document.getElementById('highlights-scroll');
        hScroll.innerHTML = highlights.map((h, index) => `
          <div class="highlight-ring" onclick="openHighlight(${index})">
            <div class="ring-outer" style="background: linear-gradient(135deg, ${h.c1 || '#8b5cf6'}, ${h.c2 || '#22d3ee'});">
              <div class="ring-inner">
                ${h.coverImage ? `<img src="${h.coverImage}" alt="${h.cat}">` : `<span>${h.icon || '⭐'}</span>`}
              </div>
            </div>
            <span class="ring-label">${h.cat}</span>
          </div>
        `).join('');
        window.siteHighlights = highlights;
      }

      // Set Builds
      const buildsData = localStorage.getItem('aayeddie_custom_builds');
      const builds = buildsData ? JSON.parse(buildsData) : (data.builds || []);
      if (builds.length > 0) {
        document.getElementById('builds-section').style.display = 'block';
        const bGrid = document.getElementById('builds-grid');
        bGrid.innerHTML = builds.map(b => `
          <div class="build-card">
            <div>
              <div class="build-title">${b.title}</div>
              <div class="build-desc">${b.desc || ''}</div>
            </div>
            ${b.url && b.url !== '#' ? `<a class="build-link" href="${b.url}" target="_blank" rel="noopener">View Build →</a>` : ''}
          </div>
        `).join('');
      }
    }

    function openHighlight(index) {
      const h = window.siteHighlights[index];
      if (!h || !h.slides || h.slides.length === 0) return;
      const slide = h.slides[0];

      const img = document.getElementById('modal-img');
      if (slide.image) {
        img.src = slide.image;
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }

      document.getElementById('modal-title').textContent = slide.title || h.cat;
      document.getElementById('modal-caption').textContent = slide.caption || '';
      document.getElementById('modal-date').textContent = slide.date ? `Date: ${slide.date}` : '';
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal(e) {
      if (!e || e.target === document.getElementById('modal') || e.target.classList.contains('modal-close')) {
        document.getElementById('modal').style.display = 'none';
      }
    }

    loadSiteData();
  </script>
</body>
</html>
